[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rex"
version = "0.4.1"
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[tool.setuptools]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery bails out.
packages = ["rex", "rex.backends", "rex.mcp", "rex.integrations"]

[project.optional-dependencies]
# `pip install rex[serve]` adds the HTTP server (rex.serve / the rex-serve CLI).
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",  # examples/server.py form uploads
]
# `pip install rex[fast]` adds the TileLang GPU fast path (rex/fast.py); everything else works without it.
fast = ["tilelang>=0.1.14"]

# `pip install rex[mcp]` adds the MCP stdio server (rex.mcp / the rex-mcp-server CLI).
mcp = ["mcp>=2.2.0"]

# `pip install rex[structured]` adds pydantic for the typed-model helpers (rex/structured.py).
structured = ["pydantic>=2.0.0"]

# `pip install rex[onnx]` adds ONNX Runtime for `rex.onnx_agent` and `onnxscript`, which
# `torch.onnx.export` requires (`scripts/export_onnx.py`, `tests/test_onnx.py`).
#
# The NumPy cap is not about ONNX: the extra's own resolution (onnx -> ml-dtypes) otherwise
# pulls NumPy 2, and torch below 2.3 is built against NumPy 1.x and raises "Numpy is not
# available" when it converts a tensor against 2.x, which `predict()` needs for its final
# `.numpy()`. This package declares `torch>=2.0.0`, so the extra must not force a NumPy the
# declared floor cannot use.
# It is scoped by marker rather than written as a blanket `numpy<3`, because a hard upper cap
# binds every `rex[onnx]` install -- including the many on a current torch -- and makes the
# extra unresolvable next to anything else requiring `numpy>=2`. The marker names the stack this
# actually affects: the macOS/Intel checkout (#948), where torch tops out at 2.2.2 and NumPy 1.26
# satisfies onnx, onnxruntime and onnxscript. Every other platform resolves what `onnx` wants,
# so none of those three is quietly pinned to NumPy 1.x on its behalf.
onnx = ["onnx", "onnxruntime", "onnxscript",
        "numpy<3; platform_system == 'Darwin' and platform_machine == 'x86_64'"]

# `pip install rex[langchain]` adds the LangChain / LangGraph integrations (rex.integrations).
langchain = [
    "langchain-core>=1.6.10",
    "langgraph>=0.1.0",
]
langgraph = [
    "langchain-core>=1.6.10",
    "langgraph>=0.1.0",
]

# `pip install rex[llamaindex]` adds the LlamaIndex query router & selector integrations (rex.integrations).
llamaindex = [
    "llama-index-core>=0.10.0",
]

# `pip install rex[crewai]` adds the CrewAI multi-agent delegation router (rex.integrations).
crewai = [
    "crewai>=0.28.0",
]

[project.scripts]
rex = "rex.cli:main"
rex-serve = "rex.serve:main"
rex-evals = "rex.evals_cli:main"
rex-mcp-server = "rex.mcp.server:main"
rex-train = "rex.train_cli:main"
laya = "rex.cli:main"
laya-serve = "rex.serve:main"
laya-evals = "rex.evals_cli:main"
laya-mcp-server = "rex.mcp.server:main"
laya-train = "rex.train_cli:main"

[project.urls]
Homepage = "https://github.com/RequinLabs/rex"
Repository = "https://github.com/RequinLabs/rex"
