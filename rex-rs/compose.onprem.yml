version: '3.8'

services:
  rex-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: rex-runtime:latest
    container_name: rex-runtime-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REX_HOST=0.0.0.0
      - REX_PORT=8080
      - REX_MODEL_PATH=/models/model.rexenc
      # Cách 1: Khóa giải mã trực tiếp
      - REX_MODEL_KEY=${REX_MODEL_KEY:-}
      # Cách 2: License handshake với License Server
      - REX_LICENSE_KEY=${REX_LICENSE_KEY:-}
      - REX_LICENSE_SERVER=${REX_LICENSE_SERVER:-}
    volumes:
      # Mount thư mục chứa model đã được mã hoá (.rexenc) từ host vào container
      - ./models:/models:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
