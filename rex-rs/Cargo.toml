[package]
name = "rex-rs"
version = "0.1.0"
edition = "2021"
authors = ["Rex Team"]
description = "High-performance encrypted on-premise runtime and packaging tool for Rex AI models"

[[bin]]
name = "rex-runtime"
path = "src/main.rs"

[[bin]]
name = "rex-pack"
path = "src/bin/pack.rs"

[dependencies]
# Cryptography & Security
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3"
async-stream = "0.3"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
axum-test = "15"
