# ======================================================================================
# REX RBA DATASET REGISTRY (Popperian MECE Demarcation)
# Dataset: https://www.kaggle.com/datasets/dasgroup/rba-dataset
# Risk-Based Authentication, Credential Stuffing & Account Takeover Defense
# Grounded strictly in RBA Schema: Mouse Dynamics, Keystroke Jitter, Device Fingerprints, IP Velocity
# Calibrated Hypothesis Density: 18-25 words per hypothesis for optimal token attention
# ======================================================================================

version: "1.0.0"

semantic_tool_slots:
  SLOT_NETWORK:
    canonical_alias: "SLOT_NETWORK_REPUTATION"
    description: "Inspect network telemetry, carrier CGNAT indicators, autonomous systems (ASNs), residential proxy egress routing, and geographical IP velocities."
    token_budget: 16
  SLOT_DEVICE:
    canonical_alias: "SLOT_DEVICE_FINGERPRINT"
    description: "Evaluate client hardware virtualization, HTML5 canvas rendering entropy, WebGL shader signatures, anti-detect browser footprints, and mobile device integrity."
    token_budget: 15
  SLOT_BEHAVIOR:
    canonical_alias: "SLOT_BEHAVIORAL_CADENCE"
    description: "Analyze human physical interaction dynamics, biological mouse trajectory curvature, keystroke flight and dwell jitter, and touch contact area dispersion."
    token_budget: 14
  SLOT_GRAPH:
    canonical_alias: "SLOT_ACCOUNT_GRAPH"
    description: "Traverse entity relationship topologies, linked account credential clusters, shared password trees, and multi-tenant authentication graphs."
    token_budget: 14

domain_types:
  TYPE_RBA_LOGIN_DEFENSE:
    description: "Evaluates multi-factor login events, biological behavioral dynamics, and device fingerprint entropy to defend user accounts against automated and syndicated authentication attacks."
    hypotheses:
      - id: "H_botnet"
        title: "Automated Credential Stuffing Botnet"
        text: "Automated distributed headless browser botnet executing high-velocity programmatic credential stuffing across authentication endpoints while attempting to simulate organic human keystroke intervals."
        is_residual: false
        associated_slots:
          [
            "SLOT_BEHAVIORAL_CADENCE",
            "SLOT_DEVICE_FINGERPRINT",
            "SLOT_NETWORK_REPUTATION",
          ]
        falsification_criteria:
          - metric: "behavior.mouse_entropy"
            operator: "GTE"
            threshold: 0.85
            description: "Biological mouse trajectory curvature entropy of 0.85 or higher indicates natural human motor micro-variations, decisively refuting linear, synthetic, or scripted headless browser cursor movements."
          - metric: "behavior.keystroke_jitter_ms"
            operator: "GTE"
            threshold: 120.0
            description: "Typing cadence timing variance exceeding 120.0 ms reflects organic cognitive pauses and neuromuscular flight times, decisively refuting deterministic programmatic credential injection loops."
          - metric: "device.cloned_hardware"
            operator: "EQ"
            threshold: false
            description: "Verified authentic physical hardware sensor telemetry and untampered WebGL primitives refute virtualized anti-detect browser emulation profiles."
      - id: "H_sybil"
        title: "Syndicated Account Takeover Ring"
        text: "Coordinated cybercrime syndicate operating cloned virtual device profiles and breached credential dumps to manually execute unauthorized account takeovers."
        is_residual: false
        associated_slots: ["SLOT_ACCOUNT_GRAPH", "SLOT_DEVICE_FINGERPRINT"]
        falsification_criteria:
          - metric: "graph.cluster_size"
            operator: "EQ"
            threshold: 1
            description: "The authentication identity is an isolated graph node with a cluster size of 1, showing zero credential sharing, zero shared recovery phones, and zero shared cookies, decisively refuting coordinated multi-account account takeover rings."
          - metric: "graph.users_on_ip_24h"
            operator: "EQ"
            threshold: 1
            description: "Observation of exactly 1 unique user account logging in from the IP address over a 24-hour window decisively refutes multi-account credential stuffing farm operations."
          - metric: "device.canvas_cluster_size"
            operator: "EQ"
            threshold: 1
            description: "A unique, solitary browser HTML5 canvas rendering fingerprint decisively refutes distributed virtual device farm clusters sharing identical spoofed configurations."
      - id: "H_shared"
        title: "Shared Gateway Login False Alarm"
        text: "Legitimate authenticated consumer login traversing carrier-grade mobile CGNAT gateway, corporate enterprise VPN proxy, or public commercial wireless infrastructure."
        is_residual: false
        associated_slots: ["SLOT_NETWORK_REPUTATION", "SLOT_ACCOUNT_GRAPH"]
        falsification_criteria:
          - metric: "network.geo_velocity_kmh"
            operator: "GTE"
            threshold: 900.0
            description: "Geographical transit speed exceeding 900 km/h between successive logins violates physical commercial flight speeds, decisively refuting authentic traveling consumer logins."
          - metric: "network.auth_failure_rate"
            operator: "GTE"
            threshold: 0.85
            description: "A catastrophic authentication failure rate exceeding 85% on the egress IP indicates hostile brute-force attacks, decisively refuting legitimate corporate or mobile CGNAT false alarms."
          - metric: "network.is_datacenter"
            operator: "EQ"
            threshold: true
            description: "Origination from commercial cloud hosting or proxy server ASNs confirms automated proxy tunneling, decisively refuting legitimate residential mobile carrier CGNAT traffic."
      - id: "H_novel"
        title: "Uncataloged Authentication Exploit"
        text: "Uncataloged zero-day authentication bypass vulnerability, novel biometric deepfake injection attack, or unprecedented session state desynchronization exploit technique."
        is_residual: true
        associated_slots:
          [
            "SLOT_NETWORK_REPUTATION",
            "SLOT_DEVICE_FINGERPRINT",
            "SLOT_BEHAVIORAL_CADENCE",
            "SLOT_ACCOUNT_GRAPH",
          ]
        falsification_criteria: []

