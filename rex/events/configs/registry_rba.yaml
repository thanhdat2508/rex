# ======================================================================================
# REX RBA HYPOTHESIS REGISTRY v2.0.0 (Popperian MECE Demarcation)
# Dataset: https://www.kaggle.com/datasets/dasgroup/rba-dataset  (31,269,264 rows profiled)
# Changes vs 1.0.0:
#   - verdict_class (LEGIT / FRAUD / ESCALATE) on every hypothesis + hypothesis_verdict_map
#   - availability per criterion: rba_dataset | client_sdk_only (missing data never falsifies)
#   - falsifiers re-grounded on RBA columns (IP, ASN, UA, Device Type, timestamp, success)
#   - removed self-contradicting falsifiers (is_datacenter / is_cgnat vs H_shared wording,
#     users_on_ip_24h == 1 and canvas_cluster_size == 1 vs single-victim manual ATO)
#   - 5 new dataset-grounded domain types; ground_truth_mapping for training/evaluation
#   - fixed 4 hypotheses per domain (H_botnet, H_sybil, H_shared, H_novel) to match Rex token layout
# ======================================================================================

version: 2.0.0
dataset:
  name: Login Data Set for Risk-Based Authentication (Wiefling et al., ACM TOPS 2022)
  url: https://www.kaggle.com/datasets/dasgroup/rba-dataset
  mirror: https://github.com/das-group/rba-dataset
  rows_profiled: 31269264
  columns:
    - index
    - Login Timestamp
    - User ID
    - Round-Trip Time [ms]
    - IP Address
    - Country
    - Region
    - City
    - ASN
    - User Agent String
    - Browser Name and Version
    - OS Name and Version
    - Device Type
    - Login Successful
    - Is Attack IP
    - Is Account Takeover
  known_artifacts:
    sentinel_user_id: -4324475583306591935
    sentinel_note: "14,025,899 rows (45%), only 4 successes: pooled attempts on non-existent accounts. Must be derived into graph.account_exists=false, never treated as one real user."
    rtt_missing_ratio: 0.953
    synthetic_ip_asn: ASN >= 500000 or IP in 10.0.0.0/8 are synthetic placeholders; set network.is_synthetic_artifact=true and skip ASN/IP-reputation falsifiers.
    geo_unreliable: Country/Region/City were reassigned per unique value; geo-velocity is meaningless on RBA (only per-user novelty is preserved).
    absent_telemetry:
      - mouse
      - keystroke
      - touch
      - canvas/WebGL
      - hardware attestation
      - session/cookie
      - datacenter/CGNAT ASN type
verdict_classes:
  LEGIT: Allow; benign explanation survived falsification.
  FRAUD: Block / step-up / runbook; malicious explanation survived.
  ESCALATE: Residual H_novel; send to Fraud Ops with dossier and falsification trail.
hypothesis_verdict_map:
  H_botnet: FRAUD
  H_sybil: FRAUD
  H_shared: LEGIT
  H_novel: ESCALATE
falsification_policy:
  semantics: Each criterion is an independent violation of a necessary condition; any satisfied criterion sets M_j = 0.
  missing_data: skip
  missing_data_note: A metric that is absent, null, or below min_support never falsifies. client_sdk_only criteria are therefore inert on RBA.
  residual_guard: H_novel is never falsified.
  cost_asymmetry: Falsifying H_shared (LEGIT) requires the strictest thresholds, consistent with the cost-sensitive verdict loss.
feature_catalog:
  network.ip_is_reputation_listed:
    slot: SLOT_NETWORK_REPUTATION
    source: Is Attack IP
    type: bool
    availability: rba_dataset
    note: Trigger/supporting only; never a falsifier (label leakage).
  network.ip_prior_success_days_for_user:
    slot: SLOT_NETWORK_REPUTATION
    source: IP Address, User ID, Login Timestamp, Login Successful
    type: int
    availability: rba_dataset
    note: Days since this IP first gave this user a successful login; null if never.
  network.asn_seen_for_user:
    slot: SLOT_NETWORK_REPUTATION
    source: ASN history of successful logins
    type: bool
    availability: rba_dataset
  network.country_seen_for_user:
    slot: SLOT_NETWORK_REPUTATION
    source: Country history of successful logins
    type: bool
    availability: rba_dataset
  network.context_novelty_count:
    slot: SLOT_NETWORK_REPUTATION
    source: Country, ASN, User Agent String vs user history
    type: int 0-3
    availability: rba_dataset
  network.ip_distinct_users_24h:
    slot: SLOT_NETWORK_REPUTATION
    source: IP Address, User ID
    type: int
    availability: rba_dataset
  network.ip_attempts_1h:
    slot: SLOT_NETWORK_REPUTATION
    source: IP Address, Login Timestamp
    type: int
    availability: rba_dataset
  network.ip_failure_rate_24h_known_accounts:
    slot: SLOT_NETWORK_REPUTATION
    source: Login Successful excl. sentinel
    type: float
    availability: rba_dataset
  network.ip_unknown_account_rate_24h:
    slot: SLOT_NETWORK_REPUTATION
    source: share of sentinel User ID per IP
    type: float
    availability: rba_dataset
  network.is_synthetic_artifact:
    slot: SLOT_NETWORK_REPUTATION
    source: ASN>=500000 or 10.0.0.0/8
    type: bool
    availability: rba_dataset
  network.rtt_ms:
    slot: SLOT_NETWORK_REPUTATION
    source: Round-Trip Time [ms]
    type: int
    availability: rba_dataset
    note: 95.3% missing; supporting only.
  network.geo_velocity_kmh:
    slot: SLOT_NETWORK_REPUTATION
    type: float
    availability: client_sdk_only
  network.is_datacenter:
    slot: SLOT_NETWORK_REPUTATION
    type: bool
    availability: client_sdk_only
    note: "Removed from H_shared falsifiers: contradicts corporate-VPN wording."
  network.is_cgnat:
    slot: SLOT_NETWORK_REPUTATION
    type: bool
    availability: client_sdk_only
    note: "Removed from H_shared falsifiers: H_shared also covers non-CGNAT benign paths."
  device.type:
    slot: SLOT_DEVICE_FINGERPRINT
    source: Device Type
    type: enum[mobile,desktop,tablet,bot,unknown,empty]
    availability: rba_dataset
  device.ua_seen_for_user:
    slot: SLOT_DEVICE_FINGERPRINT
    source: User Agent String history
    type: bool
    availability: rba_dataset
  device.browser_family_seen_for_user:
    slot: SLOT_DEVICE_FINGERPRINT
    source: Browser Name and Version (family only)
    type: bool
    availability: rba_dataset
    note: Same family, newer version = browser update (benign).
  device.ua_parse_failed:
    slot: SLOT_DEVICE_FINGERPRINT
    source: Device Type empty
    type: bool
    availability: rba_dataset
  device.ua_prior_success_days_for_user:
    slot: SLOT_DEVICE_FINGERPRINT
    source: User Agent String, Login Timestamp
    type: int
    availability: rba_dataset
  device.cloned_hardware:
    slot: SLOT_DEVICE_FINGERPRINT
    type: bool
    availability: client_sdk_only
  device.session_fingerprint_changed:
    slot: SLOT_DEVICE_FINGERPRINT
    type: bool
    availability: client_sdk_only
  behavior.user_failures_1h:
    slot: SLOT_BEHAVIORAL_CADENCE
    source: Login Successful per user
    type: int
    availability: rba_dataset
  behavior.min_inter_attempt_ms_user_10m:
    slot: SLOT_BEHAVIORAL_CADENCE
    source: Login Timestamp
    type: int
    availability: rba_dataset
    note: Timestamps include synthetic jitter.
  behavior.user_distinct_ip_failures_1h:
    slot: SLOT_BEHAVIORAL_CADENCE
    source: IP Address on failed logins
    type: int
    availability: rba_dataset
  behavior.followed_by_known_context_success_10m:
    slot: SLOT_BEHAVIORAL_CADENCE
    source: IP+UA then success on account with known ASN+UA
    type: bool
    availability: rba_dataset
  behavior.mouse_entropy:
    slot: SLOT_BEHAVIORAL_CADENCE
    type: float
    availability: client_sdk_only
  behavior.keystroke_jitter_ms:
    slot: SLOT_BEHAVIORAL_CADENCE
    type: float
    availability: client_sdk_only
  behavior.touch_variance:
    slot: SLOT_BEHAVIORAL_CADENCE
    type: float
    availability: client_sdk_only
  graph.account_exists:
    slot: SLOT_ACCOUNT_GRAPH
    source: User ID != sentinel
    type: bool
    availability: rba_dataset
  graph.user_prior_success_count:
    slot: SLOT_ACCOUNT_GRAPH
    source: User ID history
    type: int
    availability: rba_dataset
  graph.ua_asn_new_context_accounts_7d:
    slot: SLOT_ACCOUNT_GRAPH
    source: User Agent String + ASN across accounts
    type: int
    availability: rba_dataset
  graph.ua_ip_distinct_accounts_24h:
    slot: SLOT_ACCOUNT_GRAPH
    source: User Agent String + IP across accounts
    type: int
    availability: rba_dataset
  graph.user_distinct_asn_24h:
    slot: SLOT_ACCOUNT_GRAPH
    source: ASN of successful logins per user
    type: int
    availability: rba_dataset
  graph.device_distinct_accounts_30d:
    slot: SLOT_ACCOUNT_GRAPH
    type: int
    availability: client_sdk_only
semantic_tool_slots:
  SLOT_NETWORK:
    canonical_alias: SLOT_NETWORK_REPUTATION
    description: Inspect IP reputation listing, ASN and country novelty per account, IP fan-out across users, failure and unknown-account rates, and round-trip time.
    token_budget: 16
  SLOT_DEVICE:
    canonical_alias: SLOT_DEVICE_FINGERPRINT
    description: Evaluate user-agent novelty, browser family drift, declared device type, unparseable agents, and optional hardware virtualization or canvas signals.
    token_budget: 15
  SLOT_BEHAVIOR:
    canonical_alias: SLOT_BEHAVIORAL_CADENCE
    description: Analyze login cadence, failure bursts, inter-attempt timing, recovery after typos, and optional mouse, keystroke and touch dynamics.
    token_budget: 14
  SLOT_GRAPH:
    canonical_alias: SLOT_ACCOUNT_GRAPH
    description: Traverse account existence, login history depth, user-agent and ASN reuse across victim accounts, and multi-account IP clusters.
    token_budget: 14
ground_truth_mapping:
  note: Weak labels for training/evaluating Rex on RBA. Evaluate primarily at verdict_class level; hypothesis level uses acceptable sets.
  rules:
    - id: GT_ATO_LISTED
      when: Is Account Takeover == true AND Is Attack IP == true
      rows: 77
      verdict_class: FRAUD
      acceptable:
        - H_botnet
        - H_sybil
      preferred: H_botnet
      domain: TYPE_RBA_NOVEL_CONTEXT_LOGIN
    - id: GT_ATO_UNLISTED
      when: Is Account Takeover == true AND Is Attack IP == false
      rows: 64
      verdict_class: FRAUD
      acceptable:
        - H_sybil
        - H_botnet
      preferred: H_sybil
      domain: TYPE_RBA_NOVEL_CONTEXT_LOGIN
    - id: GT_LISTED_UNKNOWN_ACC
      when: Is Attack IP == true AND account_exists == false
      rows: 1650627
      verdict_class: FRAUD
      acceptable:
        - H_botnet
      domain: TYPE_RBA_UNKNOWN_ACCOUNT_PROBE
    - id: GT_LISTED_FAIL
      when: Is Attack IP == true AND account_exists == true AND Login Successful == false AND ATO == false
      rows: 641858
      verdict_class: FRAUD
      confidence: medium
      acceptable:
        - H_botnet
        - H_sybil
      domain: TYPE_RBA_FLAGGED_IP_LOGIN
    - id: GT_LISTED_SUCCESS
      when: Is Attack IP == true AND Login Successful == true AND ATO == false
      rows: 804415
      verdict_class: LEGIT
      confidence: low
      acceptable:
        - H_shared
      domain: TYPE_RBA_FLAGGED_IP_LOGIN
      note: Not flagged by incident response; may hide undetected ATO.
    - id: GT_BENIGN_SUCCESS
      when: Is Attack IP == false AND ATO == false AND Login Successful == true AND account_exists == true
      rows: 11736883
      verdict_class: LEGIT
      acceptable:
        - H_shared
      domain: TYPE_RBA_NOVEL_CONTEXT_LOGIN or TASK_RISK_INVESTIGATION
    - id: GT_BENIGN_FAIL
      when: Is Attack IP == false AND ATO == false AND Login Successful == false AND account_exists == true
      rows: 4060068
      verdict_class: LEGIT
      confidence: medium
      acceptable:
        - H_shared
      domain: TYPE_RBA_FAILED_LOGIN_BURST
    - id: GT_UNLISTED_UNKNOWN_ACC
      when: Is Attack IP == false AND account_exists == false
      rows: 12375272
      verdict_class: UNLABELED
      acceptable:
        - H_botnet
        - H_sybil
        - H_shared
        - H_novel
      domain: TYPE_RBA_UNKNOWN_ACCOUNT_PROBE
      note: Mix of typos and unlisted attacks; exclude from supervised verdict loss, use for semi-supervised/H_novel analysis.
domain_types:
  TYPE_RBA_LOGIN_DEFENSE:
    description: Evaluates login events using IP, ASN, user-agent novelty, failure history and optional client biometrics to defend accounts against automated and syndicated authentication attacks.
    rba_dataset_coverage: partial
    hypotheses:
      - id: H_botnet
        title: Automated Credential Stuffing Botnet
        text: Automated distributed botnet replaying breached credential pairs at high velocity across many accounts through rotating proxy egress and scripted or headless clients.
        verdict_class: FRAUD
        is_residual: false
        associated_slots:
          - SLOT_NETWORK_REPUTATION
          - SLOT_DEVICE_FINGERPRINT
          - SLOT_BEHAVIORAL_CADENCE
        falsification_criteria:
          - metric: network.ip_prior_success_days_for_user
            operator: GTE
            threshold: 14
            availability: rba_dataset
            min_support: 1
            description: This exact IP produced a successful login for this same account at least 14 days earlier; rotating stuffing infrastructure does not reuse the victim's own historical IP.
            calibration_note: "RBA: only 2.1% of ATO successes reused any previously seen victim IP (any age). Keep >= 14 days to stay decisive."
          - metric: behavior.mouse_entropy
            operator: GTE
            threshold: 0.85
            availability: client_sdk_only
            description: Mouse trajectory curvature entropy of 0.85 or higher reflects human motor variation, refuting scripted cursor movement.
            calibration_note: Spoofable by advanced bots; treat as strong but not absolute.
          - metric: device.cloned_hardware
            operator: EQ
            threshold: false
            availability: client_sdk_only
            description: Attested physical hardware and untampered WebGL/canvas primitives refute virtualized or anti-detect device profiles.
        supporting_signals:
          - network.ip_is_reputation_listed == true
          - device.type == bot
          - network.ip_distinct_users_24h high
        runbook: dynamic_proof_of_work + null_route_ip_cluster + block_headless
      - id: H_sybil
        title: Manual Account Takeover Operator
        text: Human fraud operator logging in manually with phished or purchased valid credentials from an unfamiliar country, ASN and reused attacker browser profile.
        verdict_class: FRAUD
        is_residual: false
        associated_slots:
          - SLOT_ACCOUNT_GRAPH
          - SLOT_DEVICE_FINGERPRINT
          - SLOT_NETWORK_REPUTATION
        falsification_criteria:
          - metric: network.ip_prior_success_days_for_user
            operator: GTE
            threshold: 30
            availability: rba_dataset
            min_support: 1
            description: This exact IP was used successfully by this account at least 30 days earlier; a manual takeover operator does not share the victim's long-standing personal IP.
          - metric: device.cloned_hardware
            operator: EQ
            threshold: false
            availability: client_sdk_only
            description: Attested physical hardware and untampered WebGL/canvas primitives refute virtualized or anti-detect device profiles.
        supporting_signals:
          - context novelty (country/ASN/UA all new)
          - graph.ua_asn_new_context_accounts_7d >= 2
          - few failures before success
        runbook: freeze_session_and_payout + force_password_reset + quarantine_fingerprint_cluster
      - id: H_shared
        title: Legitimate Owner Login
        text: Genuine account owner logging in, possibly after a typo, from shared mobile CGNAT, corporate proxy, public Wi-Fi, travel, new device or browser update.
        verdict_class: LEGIT
        is_residual: false
        associated_slots:
          - SLOT_NETWORK_REPUTATION
          - SLOT_ACCOUNT_GRAPH
        falsification_criteria:
          - metric: network.ip_is_reputation_listed
            operator: EQ
            threshold: true
            availability: rba_dataset
            min_support: 1
            description: Listed attack IP in reputation feed refutes single legitimate owner session.
          - metric: network.ip_unknown_account_rate_24h
            operator: GTE
            threshold: 0.9
            availability: rba_dataset
            min_support: 20
            description: At least 90% of attempts from this IP in 24h target non-existent accounts, a list-replay signature that no legitimate shared gateway produces.
            calibration_note: Computed from the sentinel User ID -4324475583306591935 (non-existent accounts in RBA).
          - metric: network.ip_failure_rate_24h_known_accounts
            operator: GTE
            threshold: 0.95
            availability: rba_dataset
            min_support: 50
            description: At least 95% failed logins on existing accounts from this IP in 24h, excluding non-existent-account attempts, is incompatible with legitimate shared egress.
            calibration_note: "RBA benign IPs with >=50 attempts: P90 failure rate ~0.80 (incl. unknown accounts). 0.85 on raw rate would wrongly kill H_shared for ~11k benign IPs."
          - metric: graph.ua_asn_new_context_accounts_7d
            operator: GTE
            threshold: 5
            availability: rba_dataset
            min_support: 5
            description: The same full user-agent plus ASN pair produced new-context successful logins on 5 or more distinct accounts within 7 days, a reused attacker profile, not one owner.
            calibration_note: "RBA: 109/141 ATO events share one desktop macOS 10_14_6 UA string across different victims."
          - metric: network.geo_velocity_kmh
            operator: GTE
            threshold: 1000.0
            availability: client_sdk_only
            description: Travel speed above 1000 km/h between consecutive successful logins is physically impossible for one owner.
            calibration_note: "NOT usable on RBA: Country/Region/City are synthesized per feature value and do not preserve real geo-time relations."
        supporting_signals:
          - network.asn_seen_for_user == true
          - device.ua_seen_for_user == true
          - browser family seen with newer version
        runbook: allow + downgrade_alert + whitelist_shared_egress
      - id: H_novel
        title: Uncataloged Authentication Exploit
        text: Uncataloged authentication bypass, deepfake or biometric injection, session desynchronization, or login pattern matching no known automated, manual or legitimate cause.
        verdict_class: ESCALATE
        is_residual: true
        associated_slots:
          - SLOT_NETWORK_REPUTATION
          - SLOT_DEVICE_FINGERPRINT
          - SLOT_BEHAVIORAL_CADENCE
          - SLOT_ACCOUNT_GRAPH
        falsification_criteria: []
        runbook: shadow_friction + secops_dossier + vectorized_waf_backtest(fpr<=0.0001)
  TYPE_CREDENTIAL_STUFFING:
    description: Defends against large-scale credential stuffing replaying breached username and password dumps across distributed residential, mobile and proxy networks.
    rba_dataset_coverage: full
    hypotheses:
      - id: H_botnet
        title: Automated Distributed Stuffing Engine
        text: Programmatic bot army mass-replaying breached username and password pairs, including stale or non-existent usernames, through rotating residential and mobile proxy nodes.
        verdict_class: FRAUD
        is_residual: false
        associated_slots:
          - SLOT_NETWORK_REPUTATION
          - SLOT_DEVICE_FINGERPRINT
          - SLOT_BEHAVIORAL_CADENCE
        falsification_criteria:
          - metric: network.ip_prior_success_days_for_user
            operator: GTE
            threshold: 14
            availability: rba_dataset
            min_support: 1
            description: This exact IP produced a successful login for this same account at least 14 days earlier; rotating stuffing infrastructure does not reuse the victim's own historical IP.
            calibration_note: "RBA: only 2.1% of ATO successes reused any previously seen victim IP (any age). Keep >= 14 days to stay decisive."
          - metric: behavior.followed_by_known_context_success_10m
            operator: EQ
            threshold: true
            availability: rba_dataset
            description: "The same IP and user agent logs in successfully within 10 minutes to an existing account whose history already contains this ASN and UA: a corrected typo by the real owner."
          - metric: behavior.mouse_entropy
            operator: GTE
            threshold: 0.8
            availability: client_sdk_only
            description: Mouse trajectory curvature entropy of 0.8 or higher reflects human motor variation, refuting scripted cursor movement.
            calibration_note: Spoofable by advanced bots; treat as strong but not absolute.
        supporting_signals:
          - network.ip_unknown_account_rate_24h high
          - device.type == bot
          - network.ip_is_reputation_listed == true
        runbook: dynamic_proof_of_work + null_route_ip_cluster + block_headless
      - id: H_sybil
        title: Manual Credential Validation Crew
        text: Human fraud operators manually validating small high-value stolen credential lists through anti-detect browser profiles at human typing pace.
        verdict_class: FRAUD
        is_residual: false
        associated_slots:
          - SLOT_DEVICE_FINGERPRINT
          - SLOT_ACCOUNT_GRAPH
          - SLOT_BEHAVIORAL_CADENCE
          - SLOT_NETWORK_REPUTATION
        falsification_criteria:
          - metric: network.ip_attempts_1h
            operator: GTE
            threshold: 300
            availability: rba_dataset
            min_support: 300
            description: Three hundred or more attempts per hour from one IP exceed sustained manual typing capacity, refuting human operators.
          - metric: behavior.min_inter_attempt_ms_user_10m
            operator: LTE
            threshold: 300
            availability: rba_dataset
            min_support: 3
            description: Consecutive password submissions for one account under 300 ms apart cannot be typed by a human.
            calibration_note: RBA timestamps contain synthetic randomness; validate on production telemetry.
          - metric: device.cloned_hardware
            operator: EQ
            threshold: false
            availability: client_sdk_only
            description: Attested physical hardware and untampered WebGL/canvas primitives refute virtualized or anti-detect device profiles.
        supporting_signals:
          - low attempt rate per IP
          - same UA reused across victims
        runbook: freeze_session_and_payout + force_password_reset + quarantine_fingerprint_cluster
      - id: H_shared
        title: Shared Gateway Collision Burst
        text: Authentic subscribers logging in concurrently through a shared mobile CGNAT or public gateway, with ordinary typo failures on their own existing accounts.
        verdict_class: LEGIT
        is_residual: false
        associated_slots:
          - SLOT_NETWORK_REPUTATION
          - SLOT_ACCOUNT_GRAPH
        falsification_criteria:
          - metric: network.ip_unknown_account_rate_24h
            operator: GTE
            threshold: 0.9
            availability: rba_dataset
            min_support: 20
            description: At least 90% of attempts from this IP in 24h target non-existent accounts, a list-replay signature that no legitimate shared gateway produces.
            calibration_note: Computed from the sentinel User ID -4324475583306591935 (non-existent accounts in RBA).
          - metric: network.ip_failure_rate_24h_known_accounts
            operator: GTE
            threshold: 0.95
            availability: rba_dataset
            min_support: 50
            description: At least 95% failed logins on existing accounts from this IP in 24h, excluding non-existent-account attempts, is incompatible with legitimate shared egress.
            calibration_note: "RBA benign IPs with >=50 attempts: P90 failure rate ~0.80 (incl. unknown accounts). 0.85 on raw rate would wrongly kill H_shared for ~11k benign IPs."
          - metric: graph.ua_asn_new_context_accounts_7d
            operator: GTE
            threshold: 5
            availability: rba_dataset
            min_support: 5
            description: The same full user-agent plus ASN pair produced new-context successful logins on 5 or more distinct accounts within 7 days, a reused attacker profile, not one owner.
            calibration_note: "RBA: 109/141 ATO events share one desktop macOS 10_14_6 UA string across different victims."
        supporting_signals:
          - many users per IP with normal success ratio
          - per-user context already known
        runbook: allow + downgrade_alert + whitelist_shared_egress
      - id: H_novel
        title: Novel Identity Protocol Exploit
        text: Uncataloged authentication protocol flaw, identity federation assertion bypass, or unprecedented credential validation logic loophole beyond replayed password lists.
        verdict_class: ESCALATE
        is_residual: true
        associated_slots:
          - SLOT_NETWORK_REPUTATION
          - SLOT_DEVICE_FINGERPRINT
          - SLOT_BEHAVIORAL_CADENCE
          - SLOT_ACCOUNT_GRAPH
        falsification_criteria: []
        runbook: shadow_friction + secops_dossier + vectorized_waf_backtest(fpr<=0.0001)
  TYPE_ACCOUNT_TAKEOVER:
    description: Investigates successful logins suspected as account takeover via validated stolen credentials, phishing, session tokens or device identity manipulation.
    rba_dataset_coverage: full
    hypotheses:
      - id: H_botnet
        title: Automated Stuffing Hit Exploitation
        text: Automated pipeline logging in with a credential just validated by stuffing, from a reputation-listed or rotating proxy IP, then scripting account actions.
        verdict_class: FRAUD
        is_residual: false
        associated_slots:
          - SLOT_NETWORK_REPUTATION
          - SLOT_BEHAVIORAL_CADENCE
          - SLOT_DEVICE_FINGERPRINT
        falsification_criteria:
          - metric: network.ip_prior_success_days_for_user
            operator: GTE
            threshold: 14
            availability: rba_dataset
            min_support: 1
            description: This exact IP produced a successful login for this same account at least 14 days earlier; rotating stuffing infrastructure does not reuse the victim's own historical IP.
            calibration_note: "RBA: only 2.1% of ATO successes reused any previously seen victim IP (any age). Keep >= 14 days to stay decisive."
          - metric: behavior.touch_variance
            operator: GTE
            threshold: 0.75
            availability: client_sdk_only
            description: Touch contact variance of 0.75 or higher indicates genuine fingertip interaction, refuting script-driven tap injection.
        supporting_signals:
          - network.ip_is_reputation_listed == true (55% of RBA ATO)
          - prior failures from same IP on other accounts
        runbook: dynamic_proof_of_work + null_route_ip_cluster + block_headless
      - id: H_sybil
        title: Manual Takeover Ring
