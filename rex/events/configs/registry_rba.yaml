# ======================================================================================
# REX RBA DATASET REGISTRY (Popperian MECE Demarcation)
# Dataset: https://www.kaggle.com/datasets/dasgroup/rba-dataset
# Risk-Based Authentication, Credential Stuffing & Account Takeover Defense
# ======================================================================================

version: "1.0.0"

semantic_tool_slots:
  SLOT_NETWORK:
    canonical_alias: "SLOT_NETWORK_REPUTATION"
    description: "Inspect network telemetry, carrier CGNAT indicators, autonomous systems, and proxy egress routing"
    token_budget: 16
  SLOT_DEVICE:
    canonical_alias: "SLOT_DEVICE_FINGERPRINT"
    description: "Evaluate client hardware virtualization, canvas entropy, anti-detect browser signatures, and device integrity"
    token_budget: 15
  SLOT_BEHAVIOR:
    canonical_alias: "SLOT_BEHAVIORAL_CADENCE"
    description: "Analyze human physical interaction dynamics, mouse trajectory curvature, and request rhythm entropy"
    token_budget: 14
  SLOT_GRAPH:
    canonical_alias: "SLOT_ACCOUNT_GRAPH"
    description: "Traverse entity relationship graph, linked account clusters, and shared device credential trees"
    token_budget: 14

domain_types:
  TYPE_RBA_LOGIN_DEFENSE:
    description: "Risk-based authentication evaluating login telemetry, device entropy, and credential authenticity"
    hypotheses:
      - id: "H_botnet"
        title: "Automated Credential Stuffing Botnet"
        text: "Automated distributed headless browser or residential botnet executing programmatic login stuffing"
        is_residual: false
        associated_slots:
          [
            "SLOT_BEHAVIORAL_CADENCE",
            "SLOT_DEVICE_FINGERPRINT",
            "SLOT_NETWORK_REPUTATION",
          ]
        falsification_criteria:
          - metric: "behavior.mouse_entropy"
            operator: "GTE"
            threshold: 0.85
            description: "Organic curve entropy refutes linear script automation"
          - metric: "behavior.keystroke_jitter_ms"
            operator: "GTE"
            threshold: 120.0
            description: "High biological typing variance refutes instant automated submission"
          - metric: "device.cloned_hardware"
            operator: "EQ"
            threshold: false
            description: "Authentic hardware fingerprint refutes anti-detect bot emulator"
      - id: "H_sybil"
        title: "Syndicated Account Takeover Ring"
        text: "Coordinated fraud syndicate operating cloned devices and breached credential lists for account takeover"
        is_residual: false
        associated_slots: ["SLOT_ACCOUNT_GRAPH", "SLOT_DEVICE_FINGERPRINT"]
        falsification_criteria:
          - metric: "graph.cluster_size"
            operator: "EQ"
            threshold: 1
            description: "Isolated account identity with zero syndicated credential links"
          - metric: "graph.users_on_ip_24h"
            operator: "EQ"
            threshold: 1
            description: "Single unique user on IP refutes syndicated account farm"
      - id: "H_shared"
        title: "Shared Gateway Login False Alarm"
        text: "Legitimate user login traversing carrier CGNAT, corporate proxy, or public gateway infrastructure"
        is_residual: false
        associated_slots: ["SLOT_NETWORK_REPUTATION", "SLOT_ACCOUNT_GRAPH"]
        falsification_criteria:
          - metric: "network.geo_velocity_kmh"
            operator: "GTE"
            threshold: 900.0
            description: "Supersonic travel velocity refutes legitimate shared egress false alarm"
          - metric: "network.auth_failure_rate"
            operator: "GTE"
            threshold: 0.85
            description: "Massive credential rejection rate refutes legitimate shared gateway users"
      - id: "H_novel"
        title: "Uncataloged Authentication Exploit"
        text: "Uncataloged zero-day authentication bypass, biometric deepfake injection, or novel session replay exploit"
        is_residual: true
        associated_slots:
          [
            "SLOT_NETWORK_REPUTATION",
            "SLOT_DEVICE_FINGERPRINT",
            "SLOT_BEHAVIORAL_CADENCE",
            "SLOT_ACCOUNT_GRAPH",
          ]
        falsification_criteria: []

