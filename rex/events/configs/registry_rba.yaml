      - id: "H_sybil"
        title: "Coordinated Syndicate"
        text: "Coordinated human fraud operation using cloned profiles or virtual environments"
        is_residual: false
        associated_slots: ["SLOT_DEVICE_FINGERPRINT", "SLOT_ACCOUNT_GRAPH"]
        falsification_criteria:
