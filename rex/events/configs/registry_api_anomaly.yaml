# ======================================================================================
# REX API ACCESS BEHAVIOUR ANOMALY REGISTRY (Popperian MECE Demarcation)
# Dataset: https://www.kaggle.com/datasets/tangodelta/api-access-behaviour-anomaly-dataset
# API Security, Automated Crawlers, Token Rotation & Microservice Anomaly Detection
# Grounded strictly in API Access Schema: Endpoints, Headers, Status Codes, Request Interval Jitter
# Calibrated Hypothesis Density: 18-25 words per hypothesis for optimal token attention
# ======================================================================================

version: "1.0.0"

semantic_tool_slots:
  SLOT_NETWORK:
    canonical_alias: "SLOT_NETWORK_REPUTATION"
    description: "Inspect network-layer telemetry, autonomous system numbers (ASNs), hosting and datacenter IP classifications, HTTP status code distributions, and API gateway rate-limit enforcement counters."
    token_budget: 16
  SLOT_DEVICE:
    canonical_alias: "SLOT_DEVICE_FINGERPRINT"
    description: "Evaluate API client SDK identities, User-Agent header entropy, TLS client hello fingerprints (JA3/JA4), anti-detect browser signatures, and virtualized client execution indicators."
    token_budget: 15
  SLOT_BEHAVIOR:
    canonical_alias: "SLOT_BEHAVIORAL_CADENCE"
    description: "Analyze microservice endpoint transition graph entropy, inter-request arrival interval jitter distributions, payload volume deviations, and algorithmic execution cadence."
    token_budget: 14
  SLOT_GRAPH:
    canonical_alias: "SLOT_ACCOUNT_GRAPH"
    description: "Traverse multi-tenant relationship topologies, shared developer API credential clusters, cross-tenant authorization paths, and coordinated client identity networks."
    token_budget: 14

domain_types:
  TYPE_API_ACCESS_ANOMALY:
    description: "Monitors structural deviations in API invocation patterns, sequence graph traversal anomalies across REST and GraphQL microservices, and automated crawling infrastructure attempting unauthorized business logic exploitation or bulk data extraction."
    hypotheses:
      - id: "H_botnet"
        title: "Automated API Crawler Bot"
        text: "Automated distributed headless crawler or scraping script querying REST endpoints at high programmatic cadence while attempting to evade rate limits."
        is_residual: false
        associated_slots:
          [
            "SLOT_BEHAVIORAL_CADENCE",
            "SLOT_NETWORK_REPUTATION",
          ]
        falsification_criteria:
          - metric: "behavior.request_interval_jitter_ms"
            operator: "GTE"
            threshold: 150.0
            description: "A temporal request interval jitter of 150.0 ms or higher reflects stochastic human cognitive pacing and variable network transport latency, decisively refuting deterministic sleep loops, automated timer threads, and headless programmatic scraper cadence."
          - metric: "behavior.endpoint_transition_entropy"
            operator: "GTE"
            threshold: 0.85
            description: "An endpoint transition graph entropy of 0.85 or higher demonstrates non-deterministic, human-driven exploratory navigation across UI states, decisively refuting sequential linear crawling algorithms, brute-force parameter sweeps, or automated spider recursion."
          - metric: "network.is_datacenter"
            operator: "EQ"
            threshold: true
            description: "Traffic egress originating from verified commercial datacenter or cloud hosting Autonomous System Numbers (ASNs) confirms server-side botnet or automated proxy infrastructure, decisively refuting authentic residential end-user access."
      - id: "H_sybil"
        title: "Coordinated API Exploitation Syndicate"
        text: "Organized ring utilizing rotating developer API keys and distributed virtual proxy nodes to execute bulk microservice data extraction."
        is_residual: false
        associated_slots: ["SLOT_ACCOUNT_GRAPH", "SLOT_DEVICE_FINGERPRINT"]
        falsification_criteria:
          - metric: "graph.cluster_size"
            operator: "EQ"
            threshold: 1
            description: "The observed client entity represents an isolated topological node with exactly 1 member in its credential cluster, exhibiting zero shared API keys, shared session tokens, or cross-tenant identity linkage, decisively refuting coordinated multi-account syndicate operations."
          - metric: "graph.tenant_egress_overlap"
            operator: "EQ"
            threshold: 0
            description: "The complete absence of overlapping egress IP addresses or shared gateway signatures across disparate tenant boundaries conclusively refutes coordinated cross-tenant data harvesting syndicates."
      - id: "H_shared"
        title: "Legitimate Enterprise Tenant or Gateway"
        text: "Authorized corporate enterprise client or shared gateway driving legitimate high-volume peak traffic bursts during regular business operations."
        is_residual: false
        associated_slots: ["SLOT_NETWORK_REPUTATION", "SLOT_ACCOUNT_GRAPH"]
        falsification_criteria:
          - metric: "network.http_error_rate"
            operator: "GTE"
            threshold: 0.40
            description: "An anomalous HTTP client and server error rate (4xx/5xx) exceeding 40% reflects hostile reconnaissance or malformed payload spraying, decisively refuting verified contractual enterprise B2B partner gateway traffic."
          - metric: "network.rate_limit_hits_1h"
            operator: "GTE"
            threshold: 50
            description: "Accumulating 50 or more HTTP 429 rate-limit violations within a 1-hour rolling window demonstrates aggressive volumetric quota exhaustion, decisively refuting SLA-governed enterprise partner integrations."
      - id: "H_novel"
        title: "Novel API Logic Exploit"
        text: "Uncataloged GraphQL introspection abuse or novel business logic extraction exploit technique manipulating microservice authorization boundaries."
        is_residual: true
        associated_slots:
          [
            "SLOT_NETWORK_REPUTATION",
            "SLOT_DEVICE_FINGERPRINT",
            "SLOT_BEHAVIORAL_CADENCE",
            "SLOT_ACCOUNT_GRAPH",
          ]
        falsification_criteria: []

